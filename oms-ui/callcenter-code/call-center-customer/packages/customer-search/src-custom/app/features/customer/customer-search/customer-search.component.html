<div *ngIf="isScreenInitialized" class="screen-header" [attr.tid]="'screen-header'">
  <div class="cds--row margin-left--neg1rem margin-right--0rem margin-right--neg1rem margin-bottom--1rem border-bottom--1px-solid-ui01">
      <buc-page-header *ngIf="breadCrumbList" class="screen-breadcrumb" [breadcrumbList]="breadCrumbList"
        [headerOrder]="['breadcrumb', 'button']" [customButtonTemplate]="createCustomer"> 
      </buc-page-header>
  </div>
</div>
<ng-template bucExtension [componentName]="componentId" [placement]="'top'" [id]="EXTENSION.TOP" [parent]="this">
</ng-template>

<buc-search-panel
  [showHeaderDescription]=false  
  [fieldsContainer]="fieldsContainer" 
  [oobFieldsMap]="oobFieldsMap"
  [searchSettings]="searchSettings" 
  [searchDirection]="searchDirection"
  [uncheckSavedSearchDropdown]="uncheckSavedSearchDropdown.bind(this)"
  [renderingMap]="renderingMap"
  [defaultLabels]="defaultLabels" 
  [context]="this">
</buc-search-panel>
<ng-template #createCustomer>
  <buc-button class="create-customer-btn" btnSize="sm" [type]="'ghost'" (click)="create()" resourceId="ICC000052">
    {{'CUSTOMER_SEARCH.SEARCH.LABEL_CREATE_BUTTON' | translate }}
    <svg ibmIcon="add" size="16" class="cds--btn__icon"></svg>
</buc-button>
</ng-template>

<div *ngIf="isPageInitialized" class="screen-footer">
  <div class="height--3rem width--100p">
    <div class="d--flex width--inherit">
      <div class="d--flex-ai-flex-start">
        <buc-button class="padding-right--1rem" [isDisabled]="actionsDisabled" [attr.tid]="'call-center-customer-search-search.search'"
          [btnSize]="'field'" (buttonClicked)="!actionsDisabled && querySearch()"
          enableDoubleClickCheck="true">
          {{'CUSTOMER_SEARCH.SEARCH.SEARCH' | translate}}
        </buc-button>
        <div class="clear">
          <buc-button [isDisabled]="actionsDisabled" [attr.tid]="'order-search-clear'" [btnSize]="'sm'"
            (buttonClicked)="!actionsDisabled && clearForm()" [type]="'ghost'"
            enableDoubleClickCheck="true">
            {{ 'CUSTOMER_SEARCH.SEARCH.CLEAR' | translate }}
          </buc-button>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template bucExtension [componentName]="componentId" [placement]="'bottom'" [id]="EXTENSION.BOTTOM" [parent]="this">
</ng-template>
