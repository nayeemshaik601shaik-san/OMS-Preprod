<ng-template bucExtension [componentName]="componentId" [placement]="'top'" [id]="EXTENSION.TOP" [parent]="this">
</ng-template>

<div *ngIf="!moreThanOneResult && !doneLoadingResults">
    <buc-loading [isActive]="!moreThanOneResult && !doneLoadingResults"></buc-loading>
</div>
<div *ngIf="isScreenInitialized" [style.visibility]="!moreThanOneResult && !doneLoadingResults ? 'hidden': 'visible'">
    <div class="margin-x--neg1rem d--flex-ai-center screen-header" [attr.tid]="'screen-header'">
        <buc-page-header *ngIf="breadCrumbList" class="screen-breadcrumb" [breadcrumbList]="breadCrumbList"
            [headerOrder]="['breadcrumb']"></buc-page-header>
    </div>
    <div class="screen" [attr.tid]="'div.screen'">
        <div class="screen-body cds--grid" [attr.tid]="'div.screen-body'">
            <div [attr.tid]="'div.screen-content'" class="screen-content cds--row cds--no-gutter">
                <section class="action-tabs cds--col" [attr.tid]="'section.action-tabs'">
                    <div *ngIf="!showFilter" class="">
                        <button class="expand-filter expanded-icon-container" type="button" (click)="toggleFilter()">
                            <ibm-tooltip-icon [placement]="collapseIconPlacement" [alignment]="collapseIconAlignment" [content]="collapseIconContent | translate" class="cds--tooltip-icon">
                              <svg width="16px" height="16px" viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                                  <g id="✅-FINAL" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                                      <g id="Expanded" transform="translate(-1284.000000, -60.000000)">
                                          <rect fill="#F4F4F4" x="0" y="0" width="1312" height="937"></rect>
                                          <g id="background" transform="translate(0.000000, 48.000000)" fill="#FFFFFF">
                                              <rect id="bg" x="0" y="0" width="1312" height="40"></rect>
                                          </g>
                                          <g id="Icons/-Collapse" transform="translate(1284.000000, 60.000000)" fill="#000000">
                                              <g id="Actions-/-Controls-/-open-panel--right-/-16" transform="translate(1.000000, 2.000000)">
                                                  <path d="M13,0 L1,0 C0.44771525,0 0,0.44771525 0,1 L0,11 C0,11.5522847 0.44771525,12 1,12 L13,12 C13.5522847,12 14,11.5522847 14,11 L14,1 C14,0.44771525 13.5522847,0 13,0 Z M1,1 L9,1 L9,11 L1,11 L1,1 Z M13,11 L10,11 L10,1 L13,1 L13,11 Z" id="Fill"></path>
                                              </g>
                                              <g id="Actions-/-Formatting-/-text--indent--less-/-16-Copy" transform="translate(7.000000, 8.000000) rotate(-180.000000) translate(-7.000000, -8.000000) translate(5.000000, 5.000000)">
                                                  <polygon id="Fill" points="3.047 5.75 3.564 5.244 1.25766667 3 3.564 0.756 3.047 0.25 0.22 3"></polygon>
                                              </g>
                                          </g>
                                          <g id="Summary-panel" transform="translate(1056.000000, 48.000000)"></g>
                                      </g>
                                  </g>
                              </svg>
                          </ibm-tooltip-icon>
                        </button>
                    </div>
                    <buc-table-filter #tableFilter *ngIf="hasSearched && showFilter"
                        [ngClass]="{ 'showFilter': tableFilterModel?.isOpen }"
                        [tableFilterModel]="tableFilterModel"
                        [(appliedFilter)]="searchCriteria"
                        [datePickerLabel]="datePickerLabel"
                        [datePickerRangeLabel]="datePickerRangeLabel"
                        [datePickPlaceholder]="i18nDatePlaceholder"
                        [customTemplates]="customTemplates"
                        [dateRange]="dateRange"
                        (enterpriseChange)="enterpriseChange($event)"
                        (applied)="applyFilters($event)"
                        (closeFilter)="toggleFilter()"
                        (clear)="clearFilters($event)"
                        [outsideOfTable]="true"
                        [searchSettings]="searchSettings"
                        [hasSaveSearch]="false"
                        [showChevron]="true"
                        [showFilterIcon]="false"
                        [summaryCollapse]=true>
                    </buc-table-filter>
                    <div class="table-section" *ngIf="loaded" [ngClass]="{'left-border': !showFilter}">
                        <call-center-order-table
                        [toggleFilter]="toggleFilter.bind(this)"
                        [searchCriteria]="searchCriteria"
                        [customSearchCriteria]="getOps()"
                        [tableDatadetails]="tableDatadetails"
                        [parentPage]="this"
                        (resultChange)="searchResultChange($event)"
                        [selectedEnterprise]="enterprise"
                        [searchText]="searchText"
                        (searchTextChange)="searchTextChanged($event)"
                        [tabId]="tabId"></call-center-order-table>
                    </div>
                </section>
            </div>
            <div *ngIf="!hasSearched" class="initial-empty screen-content cds--row cds--no-gutter screen-loading">
                <buc-loading [isActive]="!hasSearched "></buc-loading>
            </div>
        </div>
    </div>

</div>

<ng-template bucExtension [componentName]="componentId" [placement]="'bottom'" [id]="EXTENSION.BOTTOM" [parent]="this">
</ng-template>

<ng-template bucId="orderTotal" let-filterOption>
    <call-center-amount-range [title]="filterOption.title"
        [rangeSet]="filterOption.items"
        [enterprise]="enterprise"
        [fromSearchResultPage]="true"
        [freeformEnabled]="filterOption.value.freeformEnabled"
        (selected)="onOrderTotalRangeSelected($event, filterOption)" [attr.tid]="filterOption.id">
    </call-center-amount-range>
</ng-template>

<ng-template bucId="orderLineStatus" let-f>
    <div class="cds--label">
        <span>{{f.title | translate}}</span>
        <cds-tooltip class="tooltip-pos" [description]="tooltipTemplate" trigger="hover" [align]="'right'" [autoAlign]="'true'">
            <svg ibmIcon="information" size="16"></svg>
        </cds-tooltip>
        <ng-template #tooltipTemplate>
            {{ f.tooltipMsg | translate}}
        </ng-template>
    </div>
    <buc-combobox
        (selectItemAction)="onOrderLineStatusSelected($event, f)"
        (searchHandler)="onEmptySearch(f)"
        [placeholder]="(f.placeholder || '') | translate"
        [items]="f.items" [attr.tid]="f.id">
    </buc-combobox>
</ng-template>
