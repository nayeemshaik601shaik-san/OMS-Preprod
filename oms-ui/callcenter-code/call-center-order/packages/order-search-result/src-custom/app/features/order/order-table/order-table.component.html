<ng-template bucExtension [componentName]="componentId" [placement]="'top'" [id]="EXTENSION.TOP" [parent]="this">
</ng-template>

<div class="list-table" [attr.tid]="componentId + '-container'">
    <buc-table #groupResults
      [class.no-data]="multiModel.totalDataLength === 0" 
      [model]="multiModel" 
      [defaultPageLen]="TABLE_CONSTANTS.DEFAULT_PAGE_LENGTH"
      [skeleton]="multiModel.isLoading" 
      [tableToolbarModel]="tableToolbarModel" 
      [(selectedItems)]="selectedItems"
      (selectPage)="selectPage($event)" [gotoPageEnabled]="false"
      (sort)="onColSort($event)"
      [attr.tid]="componentId" 
      batchText="{{'order-table.SCHEMATICS.TABLE.BATCH_TEXT_MULTIPLE' | translate}}"
      applyLabel="{{'order-table.SCHEMATICS.TABLE.APPLY' | translate}}" 
      clearLabel="{{'order-table.SCHEMATICS.TABLE.CLEAR' | translate}}" 
      [searchPlaceholderText]="'ORDER_SEARCH.GENERAL.LABEL_TOOLBAR_PLACEHOLDER' | translate"
      [(searchValue)]="searchText"
      (searchValueChange)="searchTextChanged($event)"
      (clear)="searchTextCleared()"
      [cancelText]="cancelText"
      [paginationTranslations]="paginationTranslations"
      [showSelectionColumn]=false
      [showEmptyState]="true"
      [hasSearch]="true"
      [expandableSearch]="false"
      [isSearchActive]="true"
      [size]="'sm'">
    </buc-table>
  </div>
  
  <buc-icon-templates #iconTemplates id="iconTemplates"></buc-icon-templates>
  <buc-content-templates #contentTemplates id="contentTemplates"></buc-content-templates>
  
  
  <!-- templates for icons -->
 
  <ng-template #bucSettingsIcon let-data="data">
    <buc-button #b type="ghost" btnSize="sm" (click)="!b.isDisabled && data.onClick(data)">
      <svg ibmIcon="settings" size="16" [attr.tid]="componentId + '-settings-icon'"></svg>
    </buc-button>
  </ng-template>
  
  <ng-template #refresh let-data="data">
    <buc-button #r type="ghost" btnSize="sm" (click)="!r.isDisabled && data.onClick(data)">
      <svg ibmIcon="renew" size="16" [attr.tid]="componentId + '-refresh-icon'"></svg>
    </buc-button>
  </ng-template>

  <ng-template #orderNoLinkTemplate let-data="data">
    <!-- *ngIf="data.showLink"  -->
    <div class="outer">
    <a class="d--flex" tabindex="0" [attr.tid]="'orderNoAction'" (click)="openOrderDetails(data)" [title]="data.OrderNo"
      style="cursor: pointer" (keydown.enter)="$event.preventDefault(); $event.target.click();"
      (keydown.space)="$event.preventDefault(); $event.target.click();">
        <svg ibmIcon="archive" class="margin-right--0_5rem" size="16" *ngIf="data.isHistory === 'Y'"></svg>
        <span>{{ data.OrderNo }}</span>
    </a>
    <div class="icons display-flex" *ngIf="data.ExchangeType">
      <cds-tooltip class="margin-right--0_5rem" [attr.tid]="componentId + '-exchange-icon'"
        [description]="'ORDER_SEARCH.GENERAL.TOOLTIP_EXCHANGE_ORDER' | translate" trigger="hover" [autoAlign]="'true'">
        <span class="exchange-all-icon hoverOnly"></span>
    </cds-tooltip>
    </div>
    </div>
    <!-- <div *ngIf="!data.showLink" [attr.tid]="'orderNoAction'" [innerHTML]="data.OrderNo"></div> -->
  </ng-template>
  
  <ng-template #holdTemplate let-data="data">
    <svg ibmIcon="pause--outline--filled" size="16" *ngIf="data.HoldFlag === 'Y'"></svg>
    <span [innerHTML]="data.text"></span><br>
  </ng-template>

  <ng-template bucExtension [componentName]="componentId" [placement]="'bottom'" [id]="EXTENSION.BOTTOM" [parent]="this">
  </ng-template>
