<ng-template bucExtension [componentName]="componentId" [placement]="'top'" [id]="EXTENSION.TOP" [parent]="this">
</ng-template>

<div *ngIf="isScreenInitialized">
  <div #nonPanelRef class="screen cds--no-gutter" [class.cds--col]="expanded">
    <call-center-order-status [orderDetails]="summaryDetails" [holdFlag]="holdFlag"></call-center-order-status>
    <!-- Tabs start -->
    <div *ngIf="isTabsInitialized"class="order-summary-tabs cds--row" [attr.tid]="componentId + '-order-summary-tabs'">
        <buc-tabs #orderSummaryTabsRef [tabData]="orderSummaryTabs" [attr.tid]="componentId + '-tabs'"
          class="cds--col cds--col-lg-16 cds--no-gutter overflow--auto">
        </buc-tabs>
        <!--<div class="screen-loading" *ngIf="true" [attr.tid]="componentId + '-screen-loading'">
          <buc-loading [isActive]="true"></buc-loading>
        </div> -->

    </div>
    <!-- Tabs end -->
  </div>

  <!--Side panel-->
  <div #sidePanelRef class="cds--no-gutter" [class.hide-panel]="!expanded">
    <call-center-summary-notes [expanded]="expanded" [summaryDetails]="summaryDetails" [ruleSetValues]="ruleSetValues" (afterPricingChange)="refreshData()" [isDetailsPage]="true"></call-center-summary-notes>
  </div>
  <div *ngIf="!expanded  && isScreenInitialized" (click)="toggleExpand()" class="cds--no-gutter empty-summary"
    [class.hide-panel]="expanded">
  </div>
  <div class="payment-footer" *ngIf="displayPaymentFooter">
    <call-center-payment-footer [orderDetails]="summaryDetails">
    </call-center-payment-footer>
  </div>
</div>

<ng-template #lineIconTooltipTemplate let-tooltip="tooltip">
  <span>{{tooltip.data}}</span>
</ng-template>

<!-- Tabs Content start -->
<ng-template #orderLinesTab>
  <call-center-order-lines [orderDetails]="summaryDetails" [ruleSetValues]="ruleSetValues" [parentPage]="this" [orderRuleSetsValue]="orderRuleSetsValue"
    [transactionQtyRuleDetailsValue]="transactionQtyRuleDetailsVal"
    [bopisRuleValue]="bopisRuleValue" [resourceIdsForOrderDetailsActions]="resourceIdsForOrderDetailsActions"
    (navigateToChangeFulfillment)="navigateToChangeFulfillmentMethod($event)" [isAddLinesAllowed]="isAddLinesAllowed" [expandState]="!expanded"
    (navigateToAddLinesToOrder)="navigateToAddLinesToOrderMethod($event)"></call-center-order-lines>
</ng-template>
<ng-template #fulfillmentGroupTab>
    <!-- EOMS-6781: Changes start -->
     <!-- Added extn attribute -->
    <call-center-fulfillment-group-tab extn *ngIf="fulfillmentGroupLoaded" [orderDetails]="summaryDetails" [fulfillmentOrderDetails]="fulfillmentDetails"
    [isLargeOrder]="isLargeOrder" [fulfillmentGroupList] = "fulfillmentGroups"
    [bopisRuleValue]="bopisRuleValue" [selectedFulfillmentGrp]="selectedFulfillmentGrp"
    [resourceIdsForOrderDetailsActions]="resourceIdsForOrderDetailsActions"
    (parentPageRefresh)="initialize($event);" (navigateToChangeFulfillment)="navigateToChangeFulfillmentMethod($event)" [parentPage]="this">
    </call-center-fulfillment-group-tab>
    <!-- EOMS-6781: Changes end -->
</ng-template>
<ng-template #transferOrderTab>
  <call-center-related-transfer-order-lines [summaryDetails]="summaryDetails" [transferOrders]="transferOrders" />
</ng-template>

<ng-template #paymentMethodsTab>
    <call-center-payment-methods-tab [summaryDetails] = "summaryDetails" (parentPageRefresh)="initialize($event);"></call-center-payment-methods-tab>
</ng-template>

<ng-template #returnTab>
  <call-center-return-orders-tab [summaryDetails] = "summaryDetails" (parentPageRefresh)="initialize($event);"></call-center-return-orders-tab>
</ng-template>

<ng-template #alertTab>
  <buc-alert-tab [orderNo]="orderNo" [headerKey]="orderHeaderKey"></buc-alert-tab >
</ng-template>
<!-- Tabs Content end -->
<ng-template bucExtension [componentName]="componentId" [placement]="'bottom'" [id]="EXTENSION.BOTTOM" [parent]="this">
</ng-template>

<ng-template #skeletonText let-data>
  <ng-container *ngIf="data.isLoading">
    <ibm-skeleton-text [lines]="1" [minLineWidth]="50" [maxLineWidth]="100">
    </ibm-skeleton-text>
  </ng-container>
  <ng-container *ngIf="!data.isLoading">
    {{data.title}}
  </ng-container>
</ng-template>
