name: Build and Deploy — Sterling OMS Extension (GitHub-hosted)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g. EOMS-1234-fix)'
        required: true
        type: string
      environment:
        required: true
        type: choice
        options: [QA, Preprod, Prod]

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Login to ICR
        run: |
          echo "${{ secrets.IBM_CLOUD_API_KEY }}" | \
            docker login icr.io -u iamapikey --password-stdin

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Start DB2
        run: |
          mkdir -p /tmp/db2-shared
          docker run -d \
            --name om-db2server \
            -p 50000:50000 \
            -e DUMMY_PATH_PROP=1 \
            -e LICENSE="accept" \
            -e DB2INST1_PASSWORD=diet4coke \
            -e DB_DATA=OMDB \
            -e DB_BACKUP_RESTORE=false \
            -e DB_BACKUP_FILE=OMDB.tar.gz \
            -e DB_IMPORTDATA=false \
            -e BLU=false \
            -e ENABLE_ORACLE_COMPATIBILITY=true \
            -e UPDATEAVAIL=NO \
            -e SAMPLEDB=false \
            -e REPODB=false \
            -e IS_OSXFS=false \
            -e PERSISTENT_HOME=true \
            -e HADR_ENABLED=false \
            -v "$GITHUB_WORKSPACE/.github/db2-init:/tmp/oms" \
            -v "$GITHUB_WORKSPACE/.github/db2-init/create_database.sh:/var/custom/create_database.sh" \
            -v "/tmp/db2-shared:/var/oms" \
            --privileged \
            icr.io/cpopen/ibm-oms/db2:12.1.3.0 \
            /bin/bash /tmp/oms/init_db2_instance.sh

      - name: Check DB2 container started
        run: |
          sleep 5
          docker ps | grep om-db2server || (docker logs om-db2server && exit 1)

      - name: Wait for DB2 to be ready
        run: |
          echo "Waiting for DB2 to be ready..."
          for i in $(seq 1 60); do
            if [ -f /tmp/db2-shared/db.ready ]; then
              echo "DB2 is ready after $((i * 10)) seconds"
              break
            fi
            echo "Attempt $i/60 — waiting 10s..."
            sleep 10
            if [ $((i % 3)) -eq 0 ]; then
              echo "--- DB2 logs ---"
              docker logs --tail 20 om-db2server 2>&1 || true
              echo "----------------"
            fi
            if [ $i -eq 60 ]; then
              echo "ERROR: DB2 did not become ready in 10 minutes"
              docker logs om-db2server
              exit 1
            fi
          done

      - name: Set build metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "artifact-name=extension-${{ inputs.environment }}-${SHORT_SHA}-run${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build Extension JAR
        run: |
          docker run --name dtk-build \
            --network host \
            -v "$GITHUB_WORKSPACE/sourcecode:/workspace/sourcecode" \
            ghcr.io/nayeemshaik601shaik-san/om-dtk-builder:26.3.7.2 \
            /home/nayeem123/oms/devtoolkit_docker/runtime/bin/sci_ant.sh \
              -f /home/nayeem123/oms/devtoolkit_docker/runtime/devtoolkit/devtoolkit_extensions.xml \
              importfromproject \
              -Dprojectdir=/workspace/sourcecode

      - name: Extract extensions.jar
        if: always()
        run: |
          docker cp dtk-build:/home/nayeem123/oms/devtoolkit_docker/extensions.jar ./extensions.jar || true
          docker rm dtk-build || true

      - name: Verify extensions.jar
        run: |
          [ -f ./extensions.jar ] || { echo "ERROR: extensions.jar not found"; exit 1; }
          ls -lh ./extensions.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: ./extensions.jar
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Download extensions.jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ./artifacts

      - name: Rename JAR with date stamp
        id: jarname
        run: |
          DATE=$(date +%d_%m_%Y)
          JAR_NAME="extensions_${DATE}_${{ github.run_number }}.jar"
          cp ./artifacts/extensions.jar ./${JAR_NAME}
          echo "jar-name=${JAR_NAME}" >> $GITHUB_OUTPUT

      - name: Resolve IBM SST environment name
        id: envmap
        run: |
          case "${{ inputs.environment }}" in
            QA)      echo "sst-env=qa-1"      >> $GITHUB_OUTPUT ;;
            Preprod) echo "sst-env=preprod-1" >> $GITHUB_OUTPUT ;;
            Prod)    echo "sst-env=prod-1"    >> $GITHUB_OUTPUT ;;
          esac

      - name: Generate IBM SST config
        env:
          IBM_SST_TOKEN: ${{ secrets.IBM_SST_TOKEN }}
          SST_ENV: ${{ steps.envmap.outputs.sst-env }}
        run: |
          printf '{\n  "host": "selfservice.oms.supply-chain.ibm.com",\n  "port": "443",\n  "apiUrl": "selfserve/api/resources/",\n  "token": "%s",\n  "tenantCode": "crocs",\n  "environmentName": "%s"\n}\n' \
            "$IBM_SST_TOKEN" "$SST_ENV" > "$GITHUB_WORKSPACE/myconfig.json"

      - name: Upload via IBM SST
        run: |
          ./ssctl customization upload \
            --file ./${{ steps.jarname.outputs.jar-name }} \
            --config "$GITHUB_WORKSPACE/myconfig.json"

      - name: Clean up config file
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/myconfig.json"

      - name: Job Summary
        if: always()
        run: |
          echo "### Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ inputs.branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} (${{ steps.envmap.outputs.sst-env }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| JAR | ${{ steps.jarname.outputs.jar-name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
