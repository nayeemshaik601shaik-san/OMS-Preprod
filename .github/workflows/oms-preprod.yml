name: OMS Preprod Pipeline

on:
  workflow_dispatch:

jobs:
  learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Current Directory
        run: pwd

      - name: List Repository Files
        run: ls -la

      - name: Show Repository Structure
        run: find . -maxdepth 2

      - name: Show Java Version
        run: java -version
