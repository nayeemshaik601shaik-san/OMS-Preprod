name: OMS Preprod Pipeline
on:
    workflow_dispatch:
jobs:
    build:
      runs-on: self-hosted

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v5

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'

        - name: Verify Environment
          run: |
            echo "Current Directory:"
            pwd
            echo ""
            echo "Repository Files:"
            ls -la
            echo ""
            echo "Java Version:"
            java -version

        - name: Build Extension JAR
          run: |
            /home/nayeem501/oms/devtoolkit_docker/runtime/bin/sci_ant.sh -f /home/nayeem501/oms/devtoolkit_docker/runtime/devtoolkit/devtoolkit_extensions.xml importfromproject -Dprojectdir=${{ github.workspace }}/sourcecode
