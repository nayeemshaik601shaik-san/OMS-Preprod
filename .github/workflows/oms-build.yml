name: OMS Reusable Build
on:
    workflow_call:
      inputs:
        environment:
          required: true
          type: string
        projectdir:
          required: true
          type: string
jobs:
    build:
      runs-on: self-hosted
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'

        - name: Verify Environment
          run: |
            echo "Building for environment: ${{ inputs.environment }}"
            echo "Project Directory: ${{ inputs.projectdir }}"
            pwd
            ls -la
            java -version

        - name: Start Docker if not running
          working-directory: /home/nayeem123/oms/devtoolkit_docker/compose
          run: |
            if [ -z "$(docker ps -q)" ]; then
              echo "No containers running. Starting OMS..."
              ./om-compose.sh start
            else
              echo "Containers already running. Skipping start."
            fi

        - name: Build Extension JAR
          working-directory: /home/nayeem123/oms/devtoolkit_docker/runtime/bin
          run: |
            ./sci_ant.sh -f /home/nayeem123/oms/devtoolkit_docker/runtime/devtoolkit/devtoolkit_extensions.xml \
              importfromproject \
              -Dprojectdir=${{ inputs.projectdir }}
